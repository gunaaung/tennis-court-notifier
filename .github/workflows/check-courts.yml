name: Check Tennis Courts

on:
  schedule:
    # Run every 10 minutes (UTC) — free & unlimited on Public repositories
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send LINE notification even if slots have not changed (test mode)"
        required: false
        type: boolean
        default: false

concurrency:
  group: court-availability-check
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore previous court state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: court-state-${{ github.run_id }}
          restore-keys: |
            court-state-

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check courts and notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DAYS_AHEAD: "2"
          TARGET_HOURS: "19,20"
          SKIP_PAST_HOURS: "true"
        run: |
          if [ "${{ inputs.force_notify }}" = "true" ]; then
            python -m src.main --force-notify
          else
            python -m src.main
          fi

      - name: Save updated court state
        if: success() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: court-state-${{ github.run_id }}
